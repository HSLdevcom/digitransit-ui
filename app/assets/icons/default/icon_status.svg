    <animate attributeName="r" values="7;2;7" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="8" cy="8" r="3" fill="currentcolor">
    <animate attributeName="opacity" values="0.8;0.8;0.8" dur="1s" repeatCount="indefinite"/>
