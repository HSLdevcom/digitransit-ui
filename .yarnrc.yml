compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

npmMinimalAgeGate: 7d

# vitest@5.0.0 is newer than npmMinimalAgeGate allows; scoped exemption
# instead of disabling the gate outright. Safe to remove once this version
# ages past the gate on its own.
npmPreapprovedPackages:
  - vitest@5.0.0
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - '@vitest/expect@5.0.0'
  - '@vitest/snapshot@5.0.0'
  - '@vitest/utils@5.0.0'
  - '@vitest/pretty-format@5.0.0'
  - vite-node@5.0.0

packageExtensions:
  '@octokit/rest@*':
    peerDependencies:
      '@octokit/core': '*'
  graphql-config@*:
    peerDependencies:
      typescript: '*'
  lerna@*:
    peerDependencies:
      '@octokit/core': '*'
  polyfill-library@*:
    peerDependencies:
      '@types/node': '*'

yarnPath: .yarn/releases/yarn-4.13.0.cjs
