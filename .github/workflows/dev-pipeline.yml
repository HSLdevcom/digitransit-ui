name: Process push or PR

on:
  push:
    branches:
      - v3
      - next
      - hotfix
  pull_request:
    branches:
      - v3
permissions:
    id-token: write # For npm publish job
    contents: read

env:
  # We tell Playwright not to download browser binaries because we use microsoft/playwright-github-action.
  # https://github.com/microsoft/playwright/blob/v1.16.2/installation-tests/installation-tests.sh#L200-L216
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # Runners default to UTC, but some unit tests assert on times formatted in
  # local time and therefore expect the same zone the app is developed against.
  TZ: Europe/Helsinki
  # Single source of truth for the Node version used across all jobs.
  NODE_VERSION: 24.14.1

jobs:
  # install dependencies, build shared components, cache both for subsequent jobs
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node, install dependencies, build workspaces
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node, install dependencies, build workspaces
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run linters
        run: yarn lint
#      - name: lint SVG sprites using xmllint
#        run: |
#          sudo apt update
#          sudo apt install -y libxml2-utils
#          xmllint --nonet --noout static/assets/svg-sprite.*.svg

  check-versions:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The version-bump check below diffs against the PR/push base
          # commit, so it needs full git history (not the default shallow
          # clone) to compute a merge-base.
          fetch-depth: '0'
      - name: Setup Node, install dependencies, build workspaces
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-workspaces: 'false'

      - name: Check changed packages have version bumps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: yarn check-versions-workspaces

  unit-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node, install dependencies, build workspaces
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: cache built Relay queries
        id: cache-relay
        uses: actions/cache@v5
        with:
          path: |
            ./__generated__
            **/__generated__
          key: ${{ runner.os }}-relay-${{ github.sha }}
      - name: build Relay queries
        if: ${{ steps.cache-relay.outputs.cache-hit != 'true' }}
        run: |
          yarn run relay

      - name: Run unit tests
        run: yarn run test-unit

  generate-sbom:
    if: github.ref == 'refs/heads/next' || github.ref == 'refs/heads/v3'
    needs:
      - lint
      - unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node, install dependencies, build workspaces
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate SBOM
        run: yarn dlx -q @cyclonedx/yarn-plugin-cyclonedx@2.0.0 --output-file ${{ github.repository }}-${{ github.sha }}.json

      - name: Save SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-artifact-${{ github.ref_name }}
          path: ${{ github.repository }}-${{ github.sha }}.json

      - name: 'Az CLI login for central SBOM server'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.SBOM_CLIENT_ID }}
          tenant-id: ${{ secrets.SBOM_TENANT_ID }}
          subscription-id: ${{ secrets.SBOM_SUBSCRIPTION_ID }}

      - name: 'Send SBOM to central SBOM server'
        if: github.ref == 'refs/heads/v3'
        run: >-
          az storage blob upload
          --account-name ${{ secrets.SBOM_STORAGE_ACCOUNT_NAME }}
          --container-name sbom-ingest
          --file ${{ github.repository }}-${{ github.sha }}.json
          --name ${{ secrets.SBOM_ENV_KEY_DEV_V3 }}/${{ github.sha }}.json
          --auth-mode login
          --overwrite true
          
      - name: 'Send SBOM to central SBOM server'
        if: github.ref == 'refs/heads/next'
        run: >-
          az storage blob upload
          --account-name ${{ secrets.SBOM_STORAGE_ACCOUNT_NAME }}
          --container-name sbom-ingest
          --file ${{ github.repository }}-${{ github.sha }}.json
          --name ${{ secrets.SBOM_ENV_KEY_DEV_NEXT }}/${{ github.sha }}.json
          --auth-mode login
          --overwrite true
          

  # This is only done when pushing to v3
  publish-npm:
    if: github.ref == 'refs/heads/v3'
    needs:
      - lint
      - unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node, install dependencies, build workspaces
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: cache built Relay queries
        id: cache-relay
        uses: actions/cache@v5
        with:
          path: |
            ./__generated__
            **/__generated__
          key: ${{ runner.os }}-relay-${{ github.sha }}
      - name: build Relay queries
        if: ${{ steps.cache-relay.outputs.cache-hit != 'true' }}
        run: |
          yarn run relay

      - name: Update npm
        run: npm install -g npm@11.12.1
      - name: disregard changed yarn.lock
        run: git update-index --assume-unchanged yarn.lock
      - name: Publish shared components to npm
        run: |
          {
            echo 'publish-logs<<EOF' >> $GITHUB_OUTPUT
            yarn digitransit-npm-autopublish >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          }
        shell: bash
        id: publish
      - name: Parse publish logs
        if:  steps.publish.outputs.publish-logs != ''
        run: |
          {
            echo 'published-packages<<EOF' >> $GITHUB_OUTPUT
            echo "${{ steps.publish.outputs.publish-logs }}" | grep -A100 'Successfully published' >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          }
        shell: bash
        id: log-parse
      - name: Send published packages to slack
        if:  steps.log-parse.outputs.published-packages != ''
        run: |
          ./.github/workflows/scripts/slack_message.sh
        env:
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_ACCESS_TOKEN: ${{ secrets.SLACK_ACCESS_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.log-parse.outputs.published-packages }}
        shell: bash

  docker-push:
    if: github.event_name == 'push'
    needs:
      - lint
      - unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create buildInfo.js file
        run: |
          echo -e "export const COMMIT_ID = \"${GITHUB_SHA}\";\nexport const BUILD_TIME = \"$(date -Iminutes -u)\";" >app/buildInfo.js
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_AUTH }}

      - name: compute Docker image tags
        id: docker-tags
        run: |
          echo "branch-tag=${GITHUB_REF##*/}" >>$GITHUB_OUTPUT
          echo "permanent-tag=${GITHUB_REF##*/}-$(date +"%Y-%m-%dT%H.%M.%S")-${GITHUB_SHA:0:7}" >>$GITHUB_OUTPUT
      - name: build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: |
            hsldevcom/digitransit-ui:${{ steps.docker-tags.outputs.branch-tag }}
            hsldevcom/digitransit-ui:${{ steps.docker-tags.outputs.permanent-tag }}
          # https://github.com/docker/build-push-action/blob/9472e9021074a3cb3279ba431598b8836d40433f/docs/advanced/cache.md#github-cache
          # https://github.com/moby/buildkit#registry-push-image-and-cache-separately
          cache-from: type=gha
          cache-to: type=gha,mode=max,oci-mediatypes=true,compression=zstd
          push: false
          # https://docs.docker.com/build/ci/github-actions/test-before-push/
          load: true
      - name: run integration tests
        run: |
          ./test/integration/test.sh ${{ steps.docker-tags.outputs.branch-tag }}
      - name: push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: |
            hsldevcom/digitransit-ui:${{ steps.docker-tags.outputs.branch-tag }}
            hsldevcom/digitransit-ui:${{ steps.docker-tags.outputs.permanent-tag }}
          # https://github.com/docker/build-push-action/blob/9472e9021074a3cb3279ba431598b8836d40433f/docs/advanced/cache.md#github-cache
          # https://github.com/moby/buildkit#registry-push-image-and-cache-separately
          cache-from: type=gha
          push: true
