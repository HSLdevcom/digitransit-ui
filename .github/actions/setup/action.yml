name: 'Setup Node, install dependencies'
description: >-
  Sets up Node.js and restores/populates yarn + node_modules caches. The
  calling job must check out the repo itself first: GitHub Actions has to
  resolve this action's own action.yml from disk before it can run any of
  its steps (including a checkout step), so a checkout cannot happen from
  inside a local composite action.
inputs:
  node-version:
    description: 'Node.js version to use'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: 'https://registry.npmjs.org/'

    # https://github.com/actions/cache/blob/8f1e2e02865c42348f9baddbbaafb1841dce610a/examples.md#node---yarn-2
    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v5
      with:
        path: '**/node_modules'
        key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
    - name: Cache .yarn/cache
      if: ${{ steps.cache-node-modules.outputs.cache-hit != 'true' }}
      uses: actions/cache@v5
      with:
        path: '.yarn/cache'
        key: yarn-v3-cache-${{ github.ref_name }}
        restore-keys: yarn-v3-cache-v3
    - name: Install dependencies
      if: ${{ steps.cache-node-modules.outputs.cache-hit != 'true' }}
      shell: bash
      run: yarn install --immutable
